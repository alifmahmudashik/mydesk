# Builds the Windows installer on GitHub and publishes it as a release
# (installer + .blockmap + latest.yml, which installed apps use to update).
# Run it from the Actions tab ("Run workflow") or: gh workflow run desktop-release.yml
# It releases whatever "version" desktop/package.json has, as tag v<version>.
name: Desktop release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Build the installer
        run: npx electron-builder --win --publish never
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          FILES=("release/MyDesk-Setup-$VERSION.exe" "release/MyDesk-Setup-$VERSION.exe.blockmap" release/latest.yml)
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            # Already there (e.g. from an earlier, interrupted run): fill it in.
            gh release upload "v$VERSION" "${FILES[@]}" --clobber
            gh release edit "v$VERSION" --title "MyDesk for Windows $VERSION" --notes-file ../.github/desktop-release-notes.md --draft=false --latest
          else
            gh release create "v$VERSION" "${FILES[@]}" \
              --target "$GITHUB_SHA" \
              --title "MyDesk for Windows $VERSION" \
              --notes-file ../.github/desktop-release-notes.md
          fi
